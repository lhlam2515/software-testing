name: HW06 API Tests

# Runs the HW06 API test suites against the e-Shop SUT on every push that
# touches the tests or the backend. Each API gets its own job so a failure
# points at one endpoint instead of one long log.
#
# The job runs the CI regression subset of each audited suite: the test cases
# that document an already-filed SUT bug are excluded through
# homeworks/HW06/artifacts/cicd/ci-quarantine.json. A green run therefore means
# "no new regression", and the known bugs stay documented in BUG_REPORT.md and
# in the full-suite evidence under homeworks/HW06/artifacts/newman/.

on:
  push:
    branches: [feature/HW06]
    paths:
      - "apps/backend/**"
      - "homeworks/HW06/artifacts/postman/**"
      - "homeworks/HW06/artifacts/cicd/**"
      - ".github/workflows/hw06-api-tests.yml"
  workflow_dispatch: {}

env:
  # Required by REQUIREMENTS.md section 6: every request must carry
  # X-Student-Id. The collection-level pre-request script refuses to run when
  # this is blank. Not a secret — the same id is printed in the HW06 report.
  STUDENT_ID: "23127216"

jobs:
  api-tests:
    name: ${{ matrix.fr }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fr:
          - fr-02-login
          - fr-08-checkout
          - fr-15-product-crud

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SUT dependencies
        working-directory: apps/backend
        # npm ci, not npm install, would be the usual choice here. On this
        # runner npm ci fails with a false-positive EUSAGE against the
        # committed lock file ("Missing: picomatch@4.0.5 from lock file");
        # the same lock file installs cleanly with npm ci locally.
        run: npm install

      - name: Run the CI regression subset
        env:
          NEWMAN_OUT: ${{ github.workspace }}/newman-out
        run: homeworks/HW06/artifacts/cicd/run-ci-suite.sh ${{ matrix.fr }}

      - name: Publish the run summary
        if: always()
        run: |
          node homeworks/HW06/artifacts/cicd/summarize-run.mjs \
            newman-out/newman-report.json "${{ matrix.fr }}" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-${{ matrix.fr }}-${{ github.run_id }}
          path: newman-out/
          if-no-files-found: error
