name: Postman API Tests

on:
  push:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: homeworks/HW06/apps/backend
        run: npm ci

      - name: Start backend
        working-directory: homeworks/HW06/apps/backend
        run: |
          npm start > server.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start"
          cat homeworks/HW06/apps/server.log
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman API tests
        run: |
          newman run homeworks/HW06/postman/EShop-API.postman_collection.json \
            -e homeworks/HW06/postman/EShop-Environment.postman_environment.json
