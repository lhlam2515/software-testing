name: HW06 CI Spike (T3)

# T3 spike only: confirms a real GitHub Actions run can start the SUT, run
# Newman against the T2 spike collection, and produce a link + artifact for
# screenshot evidence. Not the final CI/CD skeleton (that commit is F7) and
# not one of the two official sample runs required by REQUIREMENTS.md
# section 6 (those are S7, against the full 35+ test-case collection).

on:
  workflow_dispatch: {}

jobs:
  api-tests-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Start backend
        working-directory: apps/backend
        run: |
          node server.js &
          # Use 127.0.0.1, not localhost: intermittent DNS/IPv6 resolution
          # failure ("Invalid IP address: undefined") observed with
          # localhost during the T3 local dry run.
          npx --yes wait-on http://127.0.0.1:3000/api/products --timeout 30000

      - name: Run Newman (T2 spike collection)
        working-directory: homeworks/HW06/assets
        run: |
          npx --yes newman run t2-spike-collection.json -e t2-spike-environment.json \
            --reporters cli,json,html \
            --reporter-json-export newman-spike-report.json \
            --reporter-html-export newman-spike-report.html

      - name: Upload Newman spike report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw06-ci-spike-newman-${{ github.run_id }}
          path: homeworks/HW06/assets/newman-spike-report.*
