name: HW06 API Tests

on:
  push:
    branches: [feature/HW06]
    paths:
      - "homeworks/HW06/artifacts/postman/**"
      - "apps/backend/**"
  workflow_dispatch: {}

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Start backend
        working-directory: apps/backend
        run: |
          node server.js &
          # Use 127.0.0.1, not localhost: intermittent DNS/IPv6 resolution failure
          # ("Invalid IP address: undefined") observed with localhost during T3 spike.
          npx --yes wait-on http://127.0.0.1:3000/api/products --timeout 30000

      - name: Run Newman
        working-directory: homeworks/HW06/artifacts/postman
        run: |
          npx --yes newman run collection.json -e environment.json \
            --reporters cli,json,html \
            --reporter-json-export ../newman/report.json \
            --reporter-html-export ../newman/report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-${{ github.run_id }}
          path: homeworks/HW06/artifacts/newman/
