                shipping_address:
                  type: string
                  description: >
                    UNSPECIFIED whether required, and UNSPECIFIED maximum length.
                    No length constraint or required/optional marker is documented in
                    either source for this field on this endpoint.
              example:
                total_amount: 200000
                shipping_address: "123 Le Loi, TP.HCM"
      responses:
        "200":
          description: >
