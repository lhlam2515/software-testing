name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start API server
        run: |
          npm start > server.log 2>&1 &
          sleep 5

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman API tests
        run: |
          newman run postman/EShop-API.postman_collection.json \
            -e postman/EShop-Environment.postman_environment.json