name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: homeworks/HW06/apps/backend
        run: npm ci

      - name: Start API server
        working-directory: homeworks/HW06/apps/backend
        run: |
          npm start > server.log 2>&1 &
          for i in {1..30}; do
            if nc -z localhost 3000; then
              exit 0
            fi
            sleep 1
          done
          echo "API server did not start in time"
          cat server.log
          exit 1

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman API tests
        run: |
          newman run homeworks/HW06/postman/EShop-API.postman_collection.json \
            -e homeworks/HW06/postman/EShop-Environment.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export homeworks/HW06/reports/newman-report.html
